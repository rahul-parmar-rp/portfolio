<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Loop Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">🔁 Audio Loop Player</h1>

      <div class="file-zone" id="dropZone">
        <p class="drop-hint">Drag & drop an audio file here</p>
        <label class="btn btn-primary" for="fileInput">Select Audio File</label>
        <input type="file" id="fileInput" accept="audio/*" hidden />
      </div>

      <div class="file-info" id="fileInfo" hidden>
        <div class="file-name" id="fileName">—</div>
        <div class="file-status" id="fileStatus">Ready</div>
        <div class="progress-wrap">
          <span id="currentTime">0:00</span>
          <input type="range" id="seekBar" min="0" value="0" step="0.1" />
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls" id="controls" hidden>
        <button class="btn btn-icon" id="playPauseBtn" title="Play / Pause">▶</button>
        <button class="btn btn-icon active" id="loopBtn" title="Toggle Loop">🔁</button>
        <div class="volume-wrap">
          <span>🔊</span>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
        </div>
        <div class="speed-wrap">
          <label for="speedSelect">Speed</label>
          <select id="speedSelect">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </div>
      </div>

      <!-- Custom Loop Section -->
      <div class="loop-section" id="loopSection" hidden>
        <div class="loop-section-title">Custom Loop Section</div>

        <div class="loop-mode-row">
          <label class="radio-label">
            <input type="radio" name="loopMode" id="modeFullSong" value="full" checked />
            Full Song
          </label>
          <label class="radio-label">
            <input type="radio" name="loopMode" id="modeCustom" value="custom" />
            Selected Section
          </label>
        </div>

        <div class="range-track-wrap">
          <div class="range-track" id="rangeTrack">
            <div class="range-highlight" id="rangeHighlight"></div>
            <div class="range-thumb" id="thumbStart" title="Drag start"></div>
            <div class="range-thumb thumb-end" id="thumbEnd" title="Drag end"></div>
          </div>
          <div class="range-labels">
            <span id="trackStart">0:00</span>
            <span id="trackEnd">0:00</span>
          </div>
        </div>

        <div class="time-inputs">
          <div class="time-field">
            <label for="startInput">Start</label>
            <input type="text" id="startInput" placeholder="0:00" />
          </div>
          <div class="time-field">
            <label for="endInput">End</label>
            <input type="text" id="endInput" placeholder="0:00" />
          </div>
        </div>

        <div class="loop-duration-label">Loop Duration: <span id="loopDurationDisplay">—</span></div>

        <div class="ab-buttons">
          <button class="btn btn-sm" id="setStartBtn">Set A (Start)</button>
          <button class="btn btn-sm" id="setEndBtn">Set B (End)</button>
          <button class="btn btn-sm btn-clear" id="clearLoopBtn">Clear</button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg" hidden></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
